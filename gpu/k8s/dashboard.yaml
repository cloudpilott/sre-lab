# GPU fleet dashboard (simulated H100 nodes). Picked up by the Grafana sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-fleet
  namespace: monitoring
  labels: { grafana_dashboard: "1" }
data:
  gpu-fleet.json: |
    {
     "title": "GPU Fleet - H100 + InfiniBand",
     "uid": "gpu-fleet",
     "schemaVersion": 39,
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "refresh": "30s",
     "panels": [
      {
       "type": "row",
       "title": "GPUs",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "collapsed": false,
       "panels": []
      },
      {
       "type": "bargauge",
       "title": "Visible GPUs per node (expect 8)",
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 8,
        "h": 6
       },
       "targets": [
        {
         "expr": "count by (Hostname) (DCGM_FI_DEV_GPU_TEMP)",
         "legendFormat": "{{Hostname}}"
        }
       ]
      },
      {
       "type": "table",
       "title": "Last Xid (non-zero only)",
       "gridPos": {
        "x": 8,
        "y": 1,
        "w": 8,
        "h": 6
       },
       "targets": [
        {
         "expr": "DCGM_FI_DEV_XID_ERRORS > 0",
         "legendFormat": "{{Hostname}} gpu{{gpu}}",
         "format": "table",
         "instant": true
        }
       ]
      },
      {
       "type": "table",
       "title": "Row remap pending / failed",
       "gridPos": {
        "x": 16,
        "y": 1,
        "w": 8,
        "h": 6
       },
       "targets": [
        {
         "expr": "DCGM_FI_DEV_ROW_REMAP_PENDING > 0 or DCGM_FI_DEV_ROW_REMAP_FAILURE > 0",
         "legendFormat": "{{Hostname}} gpu{{gpu}}",
         "format": "table",
         "instant": true
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "GPU temperature",
       "gridPos": {
        "x": 0,
        "y": 7,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "expr": "DCGM_FI_DEV_GPU_TEMP",
         "legendFormat": "{{Hostname}} gpu{{gpu}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "celsius"
        }
       }
      },
      {
       "type": "timeseries",
       "title": "SM clock",
       "gridPos": {
        "x": 8,
        "y": 7,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "expr": "DCGM_FI_DEV_SM_CLOCK",
         "legendFormat": "{{Hostname}} gpu{{gpu}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "MHz"
        }
       }
      },
      {
       "type": "timeseries",
       "title": "Power draw",
       "gridPos": {
        "x": 16,
        "y": 7,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "expr": "DCGM_FI_DEV_POWER_USAGE",
         "legendFormat": "{{Hostname}} gpu{{gpu}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "watt"
        }
       }
      },
      {
       "type": "timeseries",
       "title": "GPU utilization / tensor active",
       "gridPos": {
        "x": 0,
        "y": 15,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "expr": "avg by (Hostname) (DCGM_FI_DEV_GPU_UTIL)",
         "legendFormat": "{{Hostname}} util %"
        },
        {
         "expr": "avg by (Hostname) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE) * 100",
         "legendFormat": "{{Hostname}} tensor %"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percent"
        }
       }
      },
      {
       "type": "timeseries",
       "title": "ECC: correctable/min, uncorrectable total",
       "gridPos": {
        "x": 8,
        "y": 15,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "expr": "rate(DCGM_FI_DEV_ECC_SBE_VOL_TOTAL[5m]) * 60 > 0",
         "legendFormat": "{{Hostname}} gpu{{gpu}} SBE/min"
        },
        {
         "expr": "DCGM_FI_DEV_ECC_DBE_VOL_TOTAL > 0",
         "legendFormat": "{{Hostname}} gpu{{gpu}} DBE"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "NVLink CRC errors/s, PCIe replays/s",
       "gridPos": {
        "x": 16,
        "y": 15,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "expr": "rate(DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL[5m]) > 0",
         "legendFormat": "{{Hostname}} gpu{{gpu}} nvlink crc"
        },
        {
         "expr": "rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER[5m]) > 0.1",
         "legendFormat": "{{Hostname}} gpu{{gpu}} pcie replay"
        }
       ]
      },
      {
       "type": "row",
       "title": "InfiniBand (8x ConnectX-7 NDR per node)",
       "gridPos": {
        "x": 0,
        "y": 23,
        "w": 24,
        "h": 1
       },
       "collapsed": false,
       "panels": []
      },
      {
       "type": "table",
       "title": "Ports not Active / below 400 Gb/s",
       "gridPos": {
        "x": 0,
        "y": 24,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "node_infiniband_state_id != 4",
         "legendFormat": "{{Hostname}} {{device}} state",
         "format": "table",
         "instant": true
        },
        {
         "expr": "node_infiniband_rate_bytes_per_second * 8 / 1e9 < 400",
         "legendFormat": "{{Hostname}} {{device}} Gb/s",
         "format": "table",
         "instant": true
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Symbol errors/min, rcv errors/min",
       "gridPos": {
        "x": 8,
        "y": 24,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "rate(node_infiniband_symbol_error_total[5m]) * 60 > 0",
         "legendFormat": "{{Hostname}} {{device}} symbol"
        },
        {
         "expr": "rate(node_infiniband_port_errors_received_total[5m]) * 60 > 0",
         "legendFormat": "{{Hostname}} {{device}} rcv"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Link downed (30m)",
       "gridPos": {
        "x": 16,
        "y": 24,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "increase(node_infiniband_link_downed_total[30m]) > 0",
         "legendFormat": "{{Hostname}} {{device}}"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Throughput per node (TX)",
       "gridPos": {
        "x": 0,
        "y": 31,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum by (Hostname) (rate(node_infiniband_port_data_transmitted_bytes_total[2m]))",
         "legendFormat": "{{Hostname}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "Bps"
        }
       }
      },
      {
       "type": "timeseries",
       "title": "PortXmitWait rate per node (congestion)",
       "gridPos": {
        "x": 12,
        "y": 31,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum by (Hostname) (rate(node_infiniband_port_transmit_wait_total[5m]))",
         "legendFormat": "{{Hostname}}"
        }
       ]
      }
     ]
    }
