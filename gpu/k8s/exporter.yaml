# gpusim exporter: one pod pretends to be dcgm-exporter + node_exporter's infiniband collector on all 8 fake
# H100 nodes. It runs on a real worker (w1/w2). The code and the fault state are ConfigMaps that lab.sh creates
# (gpusim-code from gpu/gpusim.py, gpusim-state from gpu/state.json). Fault changes reach the pod in ~1 minute
# (kubelet ConfigMap sync).
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-sim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpusim-exporter
  namespace: gpu-sim
  labels: { app: gpusim-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gpusim-exporter }
  template:
    metadata:
      labels: { app: gpusim-exporter }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # Real workers only: not the fake nodes, and not cp1 (3 GB, already busy with k3s-server).
              - matchExpressions:
                  - { key: type, operator: NotIn, values: [kwok] }
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: [python, /app/gpusim.py, serve, --port, "9400"]
          env:
            - { name: GPUSIM_STATE, value: /state/state.json }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports:
            - { name: metrics, containerPort: 9400 }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { memory: 96Mi }
          volumeMounts:
            - { name: code,  mountPath: /app }
            - { name: state, mountPath: /state }
      volumes:
        - name: code
          configMap: { name: gpusim-code }
        - name: state
          configMap: { name: gpusim-state }
---
apiVersion: v1
kind: Service
metadata:
  name: gpusim-exporter
  namespace: gpu-sim
  labels: { app: gpusim-exporter }
spec:
  selector: { app: gpusim-exporter }
  ports:
    - { name: metrics, port: 9400, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpusim-exporter
  namespace: gpu-sim
spec:
  selector:
    matchLabels: { app: gpusim-exporter }
  endpoints:
    - port: metrics
      interval: 30s
      # Keep the exporter's own namespace/pod/container labels (the training pod using the GPU), as with dcgm-exporter.
      honorLabels: true
      metricRelabelings:
        - { sourceLabels: [__name__], regex: gpusim_.*, action: drop }   # drill bookkeeping: no peeking
